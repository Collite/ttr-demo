# The toolchain the serving images were built against. Bump in the same change that rolls the readers;
# rebuild generated/ with the same pins in the same commit. Read by model-gate.yml, regenerate.yml, and
# olymp's release checklist (apps/metadata), all through scripts/toolchain-lock.py. Why the pin is load-bearing:
# the ⛔ PINNED comment block in .github/workflows/model-gate.yml. After moving a [veles] pin: `just check-veles-pin`.
[ttr-core]
ref = "grammar/v0.21.1"          # the gate's toolchain checkout (was inline in model-gate.yml); CN-P8 S8.6:
                                 # `def variant` = `def subkind` (ttr-core#349) — the model says `variant` from here
[ttrp]
# Recipe builds/checks move independently of the model reader and serving image.
# A commit pin requires a prerelease version; delete version when moving ref to a release tag.
ref = "grammar/v0.22.10"         # AU-hartland P3J (D-249, D-250, D-253): S2.4f — decide_return's manifest reads er.entity.date_dim;
                                 # S1.5.10 — every emitted perform `keys` and outcome `key` is a key object ({<key column>: value})
                                 # was 0.22.8 (P3H, D-238): S1.5.6 engine block, S1.5.7 one-call answer, S1.5.9, S2.4e `latest`

[veles]
image = "0.11.35"                # S8.6: grammar/metadata 0.21.1 (server-libs/v0.11.35), on bp-dsk since olymp#258 — readers first
ttr-metadata = "0.21.1"          # `tatrman-ttr-metadata` in ttr-server's `gradle/libs.versions.toml` at `server-libs/v<image>`;
                                 # the gate builds its Kotlin loader from ttr-core `grammar/v<this>`, stamped with it
# true since md/hop HP-H (2026-10-24): the [veles] pin caught up with veles 0.11.15, whose ttr-metadata 0.18.3 ships
# ttr-metadata-cli (from grammar/v0.18.0; ttr-core SO-core P0·S0.3 T6). true = the gate fails without the loader,
# false = the gate says it did not run it.
strict-load = true

# Test runtime only: real loader/verifier/preview, independent of the deployed image.
[automation-preview]
server-ref = "6e81321d42a2d7471cfe911881209b07da4fffa8" # AU-server S3.1: ttr-server#397 merge (engine actions in the native preview, ⚑AU-D3-1)
grammar = "0.22.3" # published Server runtime; recipe authoring uses the same 0.22.3 (the [ttrp] pin)
