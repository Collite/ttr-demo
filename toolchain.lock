# The toolchain the serving images were built against. Bump in the same change that rolls the readers;
# rebuild generated/ with the same pins in the same commit. Read by model-gate.yml, regenerate.yml, and
# olymp's release checklist (apps/veles), all through scripts/toolchain-lock.py. Why the pin is load-bearing:
# the ⛔ PINNED comment block in .github/workflows/model-gate.yml. After moving a [veles] pin: `just check-veles-pin`.
[ttr-core]
ref = "grammar/v0.18.3"          # the gate's toolchain checkout (was inline in model-gate.yml)
[ttrp]
# Recipe builds/checks move independently of the model reader and serving image.
# A commit pin requires a prerelease version; delete version when moving ref to a release tag.
ref = "grammar/v0.18.11"          # accepted Core#307, includes declared writer-default evidence and concat

[veles]
image = "0.11.17"                # XM-P3: /model/export with public connections/locators; paired Olymp rollout
ttr-metadata = "0.18.8"          # `tatrman-ttr-metadata` in ttr-server's `gradle/libs.versions.toml` at `veles/v<image>`;
                                 # the gate builds its Kotlin loader from ttr-core `grammar/v<this>`, stamped with it
# true since md/hop HP-H (2026-10-24): the [veles] pin caught up with veles 0.11.15, whose ttr-metadata 0.18.3 ships
# ttr-metadata-cli (from grammar/v0.18.0; ttr-core SO-core P0·S0.3 T6). true = the gate fails without the loader,
# false = the gate says it did not run it.
strict-load = true

# Test runtime only: real loader/verifier/preview, independent of the deployed image.
[automation-preview]
server-ref = "5a09aebd4afd270a6056263bc4e06bb9c3f809d6" # accepted Server#312 merge
