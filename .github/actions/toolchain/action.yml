# The ttr-core toolchain hartland's workflows borrow (SO-demo P0, ⚑SO-P-4) — model-gate.yml today, regenerate.yml next.
#
# Expects the hartland checkout at `hartland/` and checks Collite/ttr-core out beside it at `tatrman/`: the side-by-side
# layout the justfile's `../tatrman` defaults assume. The ref comes from hartland/toolchain.lock and from nowhere else —
# model-gate.yml's comment block says why the pin is load-bearing. Exports TTR_CORE_REF and VELES_TTR_METADATA to the job.
#
# The build is cached per ref: a release tag does not move, so neither do its outputs (W-4 measured 2 m 47 s of toolchain
# build per cold run). The key also carries this file's hash, so a change to WHAT is built (a new CLI) builds afresh
# rather than restoring a toolchain without it. The cache is saved right after the build, not at job end, so a red
# suite later in the job still leaves the toolchain cached.
name: ttr-core toolchain
description: Check out ttr-core at toolchain.lock's ref beside hartland and build (or restore) the CLIs the justfile borrows.

outputs:
  cache-hit:
    description: "'true' when the toolchain was restored from the cache instead of built"
    value: ${{ steps.restore.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Read the toolchain pins (toolchain.lock)
      shell: bash
      run: |
        pins="$(python3 hartland/scripts/toolchain-lock.py hartland/toolchain.lock)"
        echo "$pins" >> "$GITHUB_ENV"
        echo "$pins"

    - uses: actions/checkout@v4
      with:
        repository: Collite/ttr-core
        ref: ${{ env.TTR_CORE_REF }}
        path: tatrman

    - id: restore
      uses: actions/cache/restore@v4
      with:
        path: |
          tatrman/node_modules
          tatrman/packages/*/node_modules
          tatrman/packages/*/dist
          tatrman/packages/kotlin/*/build/install
        key: ttr-toolchain-${{ runner.os }}-${{ env.TTR_CORE_REF }}-${{ hashFiles('hartland/.github/actions/toolchain/action.yml') }}

    - uses: extractions/setup-just@v2

    # The installed Kotlin CLIs run on it, cached or not.
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'

    # ── a cache miss: build ─────────────────────────────────────────────────────────────────────────────────────────
    - uses: pnpm/action-setup@v4
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        package_json_file: tatrman/package.json

    - uses: actions/setup-node@v4
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: tatrman/pnpm-lock.yaml

    - uses: actions/setup-node@v4
      if: steps.restore.outputs.cache-hit == 'true'
      with:
        node-version: '22'

    - name: Build the TS toolchain (parser, semantics, lint, resolve-packages)
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      working-directory: tatrman
      run: |
        pnpm install --frozen-lockfile
        pnpm --filter "@tatrman/migrate..." --filter "@tatrman/lint..." --filter "@tatrman/semantics..." build

    # The lexicon compiler is KOTLIN (RV-P1.2's (a3) ruling), so the pnpm build does not cover it; AU-hartland P2 added
    # the `ttrp` CLI the recipes under automation/ are checked through.
    - uses: gradle/actions/setup-gradle@v4
      if: steps.restore.outputs.cache-hit != 'true'

    - name: Build the lexicon and ttrp CLIs
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      working-directory: tatrman
      run: ./gradlew :packages:kotlin:ttr-lexicon-cli:installDist :packages:kotlin:ttrp-cli:installDist

    # The Kotlin loader the gate's strict load runs (ttr-core contracts §2.3). A separate step because Gradle refuses an
    # unknown task: until the pinned ref carries ttr-metadata-cli (ttr-core SO-core P0·S0.3) the step is skipped, and
    # the gate's load step with it.
    - name: Build the Kotlin loader CLI (ttr-metadata-cli)
      if: steps.restore.outputs.cache-hit != 'true' && hashFiles('tatrman/packages/kotlin/ttr-metadata-cli/build.gradle.kts') != ''
      shell: bash
      working-directory: tatrman
      run: ./gradlew :packages:kotlin:ttr-metadata-cli:installDist

    - uses: actions/cache/save@v4
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        path: |
          tatrman/node_modules
          tatrman/packages/*/node_modules
          tatrman/packages/*/dist
          tatrman/packages/kotlin/*/build/install
        key: ${{ steps.restore.outputs.cache-primary-key }}
