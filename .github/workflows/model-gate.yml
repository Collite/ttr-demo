# The model gate, on every push to master and every pull request.
#
# hartland is content only — it vendors no toolchain — so this job checks out the public
# Collite/ttr-core repository beside it and builds the parser, semantics, lint and resolve-packages
# CLI that the justfile and the model suites borrow from `../tatrman`, exactly as a local checkout
# side by side does. The checkout and the build are the toolchain action's
# (.github/actions/toolchain), at the ref toolchain.lock pins, cached per ref.
#
# The job's name is the required status check on master (ttr-demo#85) — renaming it unprotects master.
#
# What it runs:
#   just verify-model             every model/agents/lexicon/automation suite
#   just build-recipes            build six recipe bundles at the independent [ttrp] pin
#   just check-recipe-drift       committed bundles reproduce without drift
#   just goldens-test             the recipes' golden cases and seeds — ADDED 2026-10-19, AU P2
#   just check-model              generated/resolved-packages.json is not stale
#   just check-lexicon            generated/lexicon.tar.zst is not stale — ADDED 2026-09-16, after a
#                                 model change went live with an archive that predated it: the model
#                                 was served and its words were not, so questions about it came back
#                                 as "I don't recognise …". `check-model` already guards the other
#                                 generated artifact; this is its missing twin.
#   just check-cn-hygiene         model/cn/tests/hygiene.md is what `ttr cn hygiene` prints now — ADDED
#                                 2026-10-24, CN-P6 S6.1: the conceptual model's report (every concept's grounding
#                                 grade and hop, the definitions' findings) is a golden the cn suite reads
#   just routing-check            the routing corpus's schema (run-set/routing/) — ADDED 2026-10-15
#   just routing-test             the corpus runner's own specs (scripts/test_routing_run.py) — ADDED
#                                 2026-10-15. Both need no cluster and no secrets; before, they ran
#                                 only locally, so a runner change could break the corpus with the
#                                 gate green.
#   just bi-one-number-test       the one-number cases' schema + runner specs (run-set/bi-one-number/,
#                                 scripts/test_bi_one_number.py) — ADDED 2026-10-23, BI-4 S4.1 T5
#   just hebe-verify-test         the HB-P1 rig's Keycloak form parsing (design/hebe-demo/rig-hb/) — ADDED
#                                 2026-10-23, HE-P1 S1.2 T1
#   just dashboards-check         the Superset bundles (dashboards/) against the import's rules, and
#   just dashboards-test          kustomization.yaml not stale; the rules' specs — ADDED 2026-10-23,
#                                 BI-4 S4.2: the import Job exits 0 on a bundle it could not import
#   just hebe-seed-test           Hebe's two identity seed scripts against a fake az + curl: no secret in
#                                 output or argv, only an Offline token stored — ADDED 2026-10-23, HE-P1 S1.1
#   just n8n-test                 n8n identity/content seeds + verification rig against local fakes — N8 P1/P2/P3
#   just load-model              the model as veles loads it: the Kotlin loader, strict, built from
#                                 ttr-core at veles's ttr-metadata version (grammar/v<[veles].ttr-metadata>,
#                                 stamped with it) — ADDED 2026-10-21, SO-demo P0. Veles drops a file
#                                 it cannot parse and only WARNs about a reconcile error (SO-1 memo
#                                 [verify-4]); the TS suites above cannot see either. Runs when
#                                 toolchain.lock's [veles].strict-load is true; a notice says when not.
name: model-gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hartland

      # ⛔ PINNED, and the pin is load-bearing — do not drop it to "latest".
      #
      # `just check-lexicon` compares the COMMITTED archive against one this toolchain compiles, so
      # an unpinned toolchain makes the gate report the toolchain rather than the estate. That is
      # not hypothetical: on 2026-09-24 master went red twenty minutes after MV-T0 landed in
      # ttr-core, on a merge that touched neither the model nor the archive, because the compiler
      # had moved from `ttr-lexicon-compiled/v4` to `v5`.
      #
      # And the obvious "fix" for that red is the wrong one. Committing whatever the newest
      # toolchain compiles ships an archive the serving readers were not built for. How bad that
      # is depends on the change: a new ENUM member (v4's STRING_PREDICATE) makes an older reader
      # decode the whole archive to an EMPTY vocabulary on a WARNING, while a new defaulted field
      # (v5's `memberVocabulary`) is only ignored — readers decode with `ignoreUnknownKeys` and WARN
      # on the schema string. Either way the gate would compare against a toolchain nothing serves.
      # Readers before producers (LP contracts §8.1, corrected by review-103 L21).
      #
      # So this tag tracks the toolchain THE SERVING IMAGES WERE BUILT AGAINST. Bump it in the same
      # change that rolls the readers, never before, and rebuild `generated/lexicon.tar.zst` with
      # the same tag in the same commit.
      #
      # grammar/v0.15.2 (2026-10-18, LQ): the first toolchain whose loader accepts a `def query` in a
      # `model er` file (`model/er/customer_revenue.ttrm`). It rolls with veles 0.11.11 (olymp#96), the
      # serving reader that parses such a query. The lexicon readers are unaffected: the archive schema
      # is still `ttr-lexicon-compiled/v5`, and v0.15.2 rebuilt master's archive byte for byte
      # (`sha256:6f6bcb9b…`) before this branch's was built.
      #
      # grammar/v0.16.0 (2026-10-19, AU-hartland-P2): the first toolchain that parses the automation package
      # (`model automation`), the world's automation half (`def identity` / `grant` / `deployment` / `process` inside
      # `def world`, `writable:`) and `states:` / `transitions:` on attributes — all of which `model/` carries from
      # this change on. It rolls with a veles built on grammar 0.16 (the ttr-server bump): a 0.15 veles reading
      # `model/worlds/demo.ttrm` or the `states:` attributes would not parse them. The lexicon readers are
      # unaffected: the archive schema is still `ttr-lexicon-compiled/v5`, and v0.16.0 rebuilt master's archive
      # byte for byte (`sha256:d0789ffa…`) and its resolved-packages.json before this branch changed the model.
      #
      # grammar/v0.16.1 (2026-10-19, AU-hartland-P2): ttr-core P1's RecipeChecker — `ttrp check`, and `ttrp explain`
      # with the mode verdicts — which the recipes under automation/ are checked through. A TTR-P-only release: the
      # parser, semantics, metadata and lexicon modules are unchanged from v0.16.0, so the serving readers need no roll
      # and v0.16.1 rebuilt this branch's archive byte for byte.
      #
      # grammar/v0.18.1 (2026-10-23, CN-P4 S4.5): lexicon archive `ttr-lexicon-compiled/v6` — concept entries, the
      # reverse index (`liftsTo`) on er/md elements, a row's default sense. It rolls with lex-matcher 0.11.5 and resolver
      # 0.11.23 (olymp#123), the v6 readers, deployed first. Inert here: hartland has no `model cn`, so v0.18.1 rebuilt
      # the archive with the same 812 entries (the RV-39 lexicon hash unchanged), zero concepts and zero lifts — only
      # the schema line and so the archive id move. The model side: resolved-packages.json unchanged; the loader now
      # warns `cn/cnc-deprecated` on the twelve `roles:` files (accepted in model/tests/project-harness.mjs).
      #
      # grammar/v0.18.3 (2026-10-24, CN-P6 S6.1): md/hop's DERIVED hop (grammar/v0.18.2, ttr-core#269) in the editor
      # toolchain and in `ttr cn hygiene` — hartland's conceptual package authors no md2er, so at v0.18.1 every
      # md-grounded concept read `md-grounded-hop-missing`. The readers were rolled before: veles 0.11.15 is built on
      # ttr-metadata 0.18.3 ([veles] below), and the archive schema is still `ttr-lexicon-compiled/v6`, which lex-matcher
      # 0.11.5 and resolver 0.11.23 read. v0.18.3 rebuilt master's archive and resolved-packages.json byte for byte, and
      # master's model suites passed on it, before this branch changed the model.
      #
      # grammar/v0.18.17 (2026-10-29, SO-demo P2, the runbook's G3): ttr-core#325 — `ttr-lexicon` compiles a term whose
      # `for:` is package-qualified (`for: hartland.er.entity.returns_review`, the form `@tatrman/edit` writes) instead of
      # dropping it with RG-LEXC-001 while the build exits 0, so a term the Studio adds reaches the archive. The readers
      # need no roll: the archive schema is still `ttr-lexicon-compiled/v6` (lex-matcher 0.11.5, resolver 0.11.23), and
      # the [veles] loader is built from its own tag. v0.18.17 rebuilt master's archive, resolved-packages.json and the
      # cn hygiene report byte for byte, and master's model suites passed on it, before any branch used it.
      #
      # grammar/v0.20.3 (2026-10-31, CN-P8 S8.3): the things-in-time grammar (0.20.x, design `14`) — events are
      # instants, a durative event is an ERROR (`cn/durative-event`), relator kinds carry the `period:`. The re-model
      # needs it, and so do the readers: veles 0.11.32 is built on ttr-metadata 0.20.2 ([veles] below), whose strict loader
      # refuses master's durative events, and the 0.18 loader cannot parse the re-model, so the readers roll WITH this
      # change (olymp, right after the merge), not before it. v0.20.3 over v0.20.2 is ttr-core#340 only: the editor's
      # hygiene report grades subkinds, from/until phases and valued-state projections as `ttr cn hygiene` does (cn.test
      # C5 fails on v0.20.2). The Kotlin compilers are unchanged, so generated/ is v0.20.2's byte for byte. The lexicon
      # archive schema is still `ttr-lexicon-compiled/v6`.
      #
      # grammar/v0.21.0 (2026-11-01, version sweep VS T3): MW canonical carriers (ttr-core#338), additive over the 0.20.3
      # model — no model text changes. Every lock pin moves to the one line: [ttrp] leaves 0.18.14 (the six recipe
      # bundles are recompiled; only toolchain stamps and fingerprints move, D-137), [veles] names metadata 0.11.34 on
      # ttr-metadata 0.21.0, which bp-dsk runs since olymp#254, and [automation-preview] the ttr-server#360 merge.
      #
      # grammar/v0.21.1 (2026-11-01, CN-P8 S8.6): `def variant` is the house spelling of `def subkind` (ttr-core#349,
      # CN-D32), and model/cn now writes it — a 0.21.0 reader refuses the word, so every pin moves in this change and the
      # readers went first: [veles] metadata 0.11.35 on ttr-metadata 0.21.1 (bp-dsk since olymp#258), [ttrp] 0.21.1 (it
      # resolves the whole project), [automation-preview] the ttr-server#367 merge. One stereotype below the parser, so
      # the hygiene report and resolved-packages.json are unchanged; the lexicon and model.tar.zst move with the text.
      #
      # The pin lives in toolchain.lock ([ttr-core].ref) since 2026-10-21 (SO-demo P0, ⚑SO-P-4), beside the veles image
      # hartland deploys and the ttr-metadata version it was built with ([veles].image, [veles].ttr-metadata) — one file
      # read by this gate, regenerate.yml and olymp's release checklist. The history above is the lock's; the rule is
      # unchanged: bump it in the change that rolls the readers, and rebuild generated/ with it in the same commit. The
      # [veles] pins are not checked here (olymp is private): `just check-veles-pin` is the bump-time check.
      - uses: ./hartland/.github/actions/toolchain
        with:
          with-loader: 'true'
          with-recipes: 'true'

      # The routing corpus: uv runs the runner (inline script metadata: httpx + pyyaml). Python is
      # PINNED: with no interpreter that satisfies requires-python, uv fetches the newest one and may
      # have to build a dependency from source.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Routing corpus schema
        working-directory: hartland
        run: just routing-check

      - name: Routing runner specs
        working-directory: hartland
        run: just routing-test

      - name: One-number cases and runner specs
        working-directory: hartland
        run: just bi-one-number-test

      - name: Superset dashboards (bundle rules, kustomization, specs)
        working-directory: hartland
        run: just dashboards-check && just dashboards-test

      - name: Hebe identity seed scripts (fake az + curl)
        working-directory: hartland
        run: just hebe-seed-test

      - name: Literate recipe derivations are current (EN + CS)
        working-directory: hartland
        run: just check-literate-recipes

      - name: n8n seed and verification rig (local fakes)
        working-directory: hartland
        run: just n8n-test

      - name: Model suites
        working-directory: hartland
        run: just verify-model

      - name: Recipe build script regressions
        working-directory: hartland
        run: python3 -m unittest scripts/test_build_recipes.py scripts/test_toolchain_ttrp.py scripts/test_writer_preview.py scripts/test_check_metadata_pin.py

      - name: OpenMetadata rig regressions (offline)
        working-directory: hartland
        run: just openmetadata-test

      - name: Hebe rig specs (Keycloak form parsing, verify.sh helpers)
        working-directory: hartland
        run: just hebe-verify-test

      - name: Build the recipe bundles
        working-directory: hartland
        run: just build-recipes

      - name: Recipe bundles are not stale
        working-directory: hartland
        run: just check-recipe-drift

      - name: The golden cases (contracts §7) and their seeds
        working-directory: hartland
        run: just goldens-test

      - name: resolved-packages.json is not stale
        working-directory: hartland
        run: just check-model

      # ⚑ A stale archive is not a warning: the vocabulary a question is matched against IS this
      # file, so a model change that does not reach it leaves the estate able to serve the model
      # and unable to understand a question about it.
      - name: lexicon.tar.zst is not stale
        working-directory: hartland
        run: just check-lexicon

      # CN-P6 S6.1: the conceptual model's hygiene report, over model/ plus the automation package (the parametric
      # phases read its parameters) — the golden model/cn/tests/cn.test.mjs reads (A-H-5: no hop missing, no md2er).
      - name: cn hygiene report is not stale
        working-directory: hartland
        run: just check-cn-hygiene

      # SO-demo P0 (D-28; review-121 ⚑R121-A/B): the files as veles loads them, with the loader built
      # from ttr-core at veles's ttr-metadata version and stamped with it (the toolchain action). `--strict`
      # fails on a dropped file or a reconcile error; `--expect-version` on a CLI that is not that version.
      # The JSON on stdout is the diagnostics the Studio also shows; uploaded for people — the BFF reads the
      # check's conclusion, not the artifact. Runs exactly when toolchain.lock's [veles].strict-load is true,
      # and then a missing CLI is red; nothing is decided from what a build happened to produce.
      - name: load with the Kotlin loader
        if: env.STRICT_LOAD == 'true'
        working-directory: hartland
        shell: bash
        run: just load-model | tee gate-diagnostics.json

      - name: The strict load is off
        if: env.STRICT_LOAD != 'true'
        run: echo "::notice title=strict load off::toolchain.lock [veles].strict-load = false — the Kotlin loader did not run"

      - name: Upload the loader's diagnostics
        if: ${{ !cancelled() && hashFiles('hartland/gate-diagnostics.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: gate-diagnostics
          path: hartland/gate-diagnostics.json
