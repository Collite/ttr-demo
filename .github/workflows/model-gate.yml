# The model gate, on every push to master and every pull request.
#
# hartland is content only — it vendors no toolchain — so this job checks out the public
# Collite/ttr-core repository beside it and builds the parser, semantics, lint and resolve-packages
# CLI that the justfile and the model suites borrow from `../tatrman`, exactly as a local checkout
# side by side does.
#
# What it runs:
#   just verify-model             every model/agents/lexicon suite
#   just check-model              generated/resolved-packages.json is not stale
#   just check-lexicon            generated/lexicon.tar.zst is not stale — ADDED 2026-09-16, after a
#                                 model change went live with an archive that predated it: the model
#                                 was served and its words were not, so questions about it came back
#                                 as "I don't recognise …". `check-model` already guards the other
#                                 generated artifact; this is its missing twin.
#   just routing-check            the routing corpus's schema (run-set/routing/) — ADDED 2026-10-15
#   just routing-test             the corpus runner's own specs (scripts/test_routing_run.py) — ADDED
#                                 2026-10-15. Both need no cluster and no secrets; before, they ran
#                                 only locally, so a runner change could break the corpus with the
#                                 gate green.
name: model-gate

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: hartland

      # ⛔ PINNED, and the pin is load-bearing — do not drop it to "latest".
      #
      # `just check-lexicon` compares the COMMITTED archive against one this toolchain compiles, so
      # an unpinned toolchain makes the gate report the toolchain rather than the estate. That is
      # not hypothetical: on 2026-09-24 master went red twenty minutes after MV-T0 landed in
      # ttr-core, on a merge that touched neither the model nor the archive, because the compiler
      # had moved from `ttr-lexicon-compiled/v4` to `v5`.
      #
      # And the obvious "fix" for that red is the wrong one. Committing whatever the newest
      # toolchain compiles ships an archive the serving readers were not built for. How bad that
      # is depends on the change: a new ENUM member (v4's STRING_PREDICATE) makes an older reader
      # decode the whole archive to an EMPTY vocabulary on a WARNING, while a new defaulted field
      # (v5's `memberVocabulary`) is only ignored — readers decode with `ignoreUnknownKeys` and WARN
      # on the schema string. Either way the gate would compare against a toolchain nothing serves.
      # Readers before producers (LP contracts §8.1, corrected by review-103 L21).
      #
      # So this tag tracks the toolchain THE SERVING IMAGES WERE BUILT AGAINST. Bump it in the same
      # change that rolls the readers, never before, and rebuild `generated/lexicon.tar.zst` with
      # the same tag in the same commit.
      #
      # grammar/v0.15.2 (2026-10-18, LQ): the first toolchain whose loader accepts a `def query` in a
      # `model er` file (`model/er/customer_revenue.ttrm`). It rolls with veles 0.11.11 (olymp#96), the
      # serving reader that parses such a query. The lexicon readers are unaffected: the archive schema
      # is still `ttr-lexicon-compiled/v5`, and v0.15.2 rebuilt master's archive byte for byte
      # (`sha256:6f6bcb9b…`) before this branch's was built.
      - uses: actions/checkout@v4
        with:
          repository: Collite/ttr-core
          ref: grammar/v0.15.2
          path: tatrman

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: tatrman/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tatrman/pnpm-lock.yaml

      - uses: extractions/setup-just@v2

      # The routing corpus: uv runs the runner (inline script metadata: httpx + pyyaml). Python is
      # PINNED: with no interpreter that satisfies requires-python, uv fetches the newest one and may
      # have to build a dependency from source.
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - name: Routing corpus schema
        working-directory: hartland
        run: just routing-check

      - name: Routing runner specs
        working-directory: hartland
        run: just routing-test

      - name: Build the tatrman toolchain the recipes borrow
        working-directory: tatrman
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter "@tatrman/migrate..." --filter "@tatrman/lint..." --filter "@tatrman/semantics..." build

      # The lexicon compiler is KOTLIN (RV-P1.2's (a3) ruling), so it is not covered by the pnpm
      # build above — `just check-lexicon` borrows `installDist`'s binary from ../tatrman exactly
      # as a side-by-side local checkout does.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Build the lexicon CLI the recipes borrow
        working-directory: tatrman
        run: ./gradlew :packages:kotlin:ttr-lexicon-cli:installDist

      - name: Model suites
        working-directory: hartland
        run: just verify-model

      - name: resolved-packages.json is not stale
        working-directory: hartland
        run: just check-model

      # ⚑ A stale archive is not a warning: the vocabulary a question is matched against IS this
      # file, so a model change that does not reach it leaves the estate able to serve the model
      # and unable to understand a question about it.
      - name: lexicon.tar.zst is not stale
        working-directory: hartland
        run: just check-lexicon
