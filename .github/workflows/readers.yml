name: readers

on:
  push:
    branches:
      - master
      # Run certification CI while the stage's review gate is open.
      - feat/mw-demo-p5-s5.5c-readers
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: python3 scripts/check_readers.py
