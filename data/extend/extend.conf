-- LR-P4 data extension — frozen parameters (contracts C-8, ⚑LR-10).
-- Read by extend.sql (`\ir extend.conf`); run-extend.sh prepends it to the piped script.

-- The year every extended week is copied from. 2024 is a normal year in both worlds — the
-- meltdown seeds (S1–S3) only touch 2025 — so extended weeks show the meltdown DC recovered.
\set template_year 2024

-- Jitter, in basis points: every copied line's amounts and quantities move by up to ±2 %,
-- deterministically (hash of the new order number and the item).
\set jitter_bp 200

-- Added to *_order_number / *_ticket_number, times the 52-week cycle k (2 for every 2026 week).
-- Originals stay below 240 001, so a copy is distinct by construction. The columns are `integer`
-- (≤ 2 147 483 647): 1e8 lasts to k = 21 (about 2045); extend.sql refuses a k it would overflow.
-- 1e9 until 2026-10-11 (ruling 11): it overflowed at k = 3 (2026-12-29). A world extended with 1e9
-- must be reset before it is extended with 1e8 (README "Reset"); extend.sql refuses to mix them.
\set order_offset 100000000

-- The meltdown DC (S1–S3 target). UNUSED by design: extended weeks copy 2024, so the DC is
-- recovered — 2026 reads as a normal year (C-8·6). Kept so the reader sees it was considered.
\set meltdown_sk 5
