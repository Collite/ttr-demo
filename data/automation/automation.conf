-- AU-hartland P1 — the generator's frozen parameters (contracts §1, §5; README.md has the derivation each one
-- steers). run-automation.sh prepends this file to the piped scripts, after the world's `\set fx` (1 in the US
-- world; localize-cz/fx.conf in the CZ one), and passes what it reads from the world with -v:
--   as_of    the demo day, YYYY-MM-DD (default: the Monday of the last `_extend_meta` week)
--   locale   us | cz (cz ⇔ `_localize_meta` holds `czk_fx`)

-- Web order numbers move up by this much. TPC-DS numbers web and marketplace orders each from 1, and
-- sales_order holds both: the originals stay below 240 001 and an extended copy adds k·1e8 (data/extend), so
-- a web order is k·1e8 + 2e7 + n and a marketplace one k·1e8 + n — disjoint for every k data/extend allows
-- (k ≤ 21: 21·1e8 + 2e7 + 240 000 < 2^31).
\set web_order_offset 20000000

-- The price list's year (data/extend's template year): one open-ended list price per (item, channel) from
-- 1 January, and the year before as a closed window at 97 %.
\set template_year 2024

-- An order placed more than this many days before as_of has been delivered, 3–7 days after it was placed.
\set delivered_after 10

-- The recipes' parameters — 17 §1's values (the package's), mirrored so the plants are built against them. The
-- money ones are USD; the CZ world's are × threshold_scale_cz = 25 (1 250 000 Kč for the confirmation threshold
-- — a round figure, not the FX rate 23); the CZ deployment sets its parameters to them.
\set p_tolerance 0.01
\set p_confirmation_threshold 50000
\set p_return_window 30
\set p_abuse_share 0.40
\set p_small_value 15
\set p_care_threshold 500
\set p_inbound_reminder 14
\set p_inbound_close 30
\set p_settlement 5
-- H-3 (04): a proposal when the latest stock covers less than this many weeks of the last period's demand.
\set p_reorder_cover_weeks 3
\set p_reorder_period_weeks 8
-- H-5 (04): a win-back mail in the last this-many days keeps a customer off the list ("once per quarter").
\set p_winback_mail_window 92
\set threshold_scale_cz 25

-- The demo day's open orders (17 §3's candidates, state placed/held): the latest placed_orders + held_orders
-- orders placed on or before as_of, all but outage_orders of them with no line at the outage center …
\set placed_orders 150
\set held_orders 3
\set outage_orders 2
-- … among those whose value at the price list stays under this share of the confirmation threshold: every
-- open order is a plain `release` until 40-plant.sql plants its defect, and the +7 % price plant stays under it.
\set open_value_cap 0.8

-- customer_price: 1 in this many (customer, item) pairs with lines (~2 %), at 90–97 % of the item's lowest list price.
\set customer_price_mod 50

-- invoice: due this many days after it is issued.
\set payment_days 14

-- warehouse_outage: this many 1–3-day windows per warehouse in the template year (40-plant.sql adds the one over as_of).
\set outages_per_center 3

-- Returns (30-returns.sql). Return lines are numbered from here (request numbers from 1), so the two never read alike.
\set line_id_base 1000000
-- The TPC-DS reason → the line's reason code (the rest are `other`): damaged = package damaged · stopped working ·
-- parts missing · not working any more; did_not_arrive = did not get it on time; wrong_size = did not fit · wrong size.
\set reasons_damaged '{1,2,5,15}'
\set reasons_did_not_arrive '{3}'
\set reasons_wrong_size '{16,17}'
-- The requested resolution, by a hash of the line: refund this many in 10, exchange the next share, replacement the rest.
\set refund_in_10 6
\set exchange_in_10 2

-- The plants (40-plant.sql; the H-1 and H-2 counts are contracts §5's, written in the scripts): H-3's reorder pairs,
-- H-5's customers mailed inside the mail window (kept off the list).
\set reorder_pairs 25
\set winback_mailed 10

-- The world's money scale and the parameters in its currency (derived; nothing to edit below).
SELECT :'locale' = 'cz' AS au_cz \gset
\if :au_cz
\set threshold_scale :threshold_scale_cz
\else
\set threshold_scale 1
\endif
SELECT :p_confirmation_threshold * :threshold_scale AS confirmation_threshold,
       :p_care_threshold * :threshold_scale AS care_threshold,
       :p_small_value * :threshold_scale AS small_value \gset
