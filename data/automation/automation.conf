-- AU-hartland P1 — the generator's frozen parameters (contracts §1, §5; README.md has the derivation each one
-- steers). run-automation.sh prepends this file to the piped scripts, after the world's `\set fx` (1 in the US
-- world; localize-cz/fx.conf in the CZ one), and passes what it reads from the world with -v:
--   as_of    the demo day, YYYY-MM-DD (default: the Monday of the last `_extend_meta` week)
--   locale   us | cz (cz ⇔ `_localize_meta` holds `czk_fx`)

-- Web order numbers move up by this much. TPC-DS numbers web and marketplace orders each from 1, and
-- sales_order holds both: the originals stay below 240 001 and an extended copy adds k·1e8 (data/extend), so
-- a web order is k·1e8 + 2e7 + n and a marketplace one k·1e8 + n — disjoint for every k data/extend allows
-- (k ≤ 21: 21·1e8 + 2e7 + 240 000 < 2^31).
\set web_order_offset 20000000

-- The price list's year (data/extend's template year): one open-ended list price per (item, channel) from
-- 1 January, and the year before as a closed window at 97 %.
\set template_year 2024

-- An order placed more than this many days before as_of has been delivered, 3–7 days after it was placed.
\set delivered_after 10

-- The demo day's open orders (state `placed`, 17 §3's candidates): the latest this many orders placed on or
-- before as_of …
\set placed_orders 150
-- … among those whose value at the price list stays under this share of the confirmation threshold: every
-- open order is a plain `release` until S1.2 plants its defect, and the +7 % price plant stays under it too.
\set open_value_cap 0.8
-- 17 §1 `confirmation_threshold`, in USD. The CZ world's is × threshold_scale_cz = 1 250 000 Kč — a round
-- figure, not the FX rate (25, not 23); the CZ deployment sets the parameter to it.
\set confirmation_threshold 50000
\set threshold_scale_cz 25

-- customer_price: 1 in this many (customer, item) pairs with lines (~2 %), at 90–97 % of the item's lowest list price.
\set customer_price_mod 50

-- invoice: due this many days after it is issued.
\set payment_days 14

-- warehouse_outage: this many 1–3-day windows per warehouse in the template year (S1.2 plants the one over as_of).
\set outages_per_center 3

-- The world's scale of the H-1 threshold (derived; nothing to edit below).
SELECT :'locale' = 'cz' AS au_cz \gset
\if :au_cz
\set threshold_scale :threshold_scale_cz
\else
\set threshold_scale 1
\endif
