# GENERATED by `just dashboards-kustomize` from import.yaml and the bundles; `just dashboards-check` fails on drift.
#
# Renders every bundle file into the `superset-dashboards` ConfigMap. olymp's `superset-dashboards` Application applies
# it beside the import Job (platform/bi/superset-dashboards). The Job is a PostSync hook, so a merge that changes a
# bundle changes this ConfigMap and the import runs (contract C-23). ConfigMap keys cannot hold `/`: a key is
# `<dashboard>.<world>.<kind>.<file>`, and the Job re-nests it by `<kind>`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: superset-dashboards
    files:
      - dc-meltdown-stockouts.cz.datasets.stockouts-monthly-dc.yaml=dc-meltdown-stockouts/bundle/cz/datasets/stockouts-monthly-dc.yaml
      - dc-meltdown-stockouts.cz.charts.tydny-s-vypadkem-po-mesicich-a-dc-2025.yaml=dc-meltdown-stockouts/bundle/cz/charts/tydny-s-vypadkem-po-mesicich-a-dc-2025.yaml
      - dc-meltdown-stockouts.cz.charts.tydny-s-vypadkem-podle-dc-2025.yaml=dc-meltdown-stockouts/bundle/cz/charts/tydny-s-vypadkem-podle-dc-2025.yaml
      - dc-meltdown-stockouts.cz.charts.tydny-s-vypadkem-zasob-v-roce-2025.yaml=dc-meltdown-stockouts/bundle/cz/charts/tydny-s-vypadkem-zasob-v-roce-2025.yaml
      - dc-meltdown-stockouts.cz.dashboards.vypadky-zasob-v-distribucnich-centrech.yaml=dc-meltdown-stockouts/bundle/cz/dashboards/vypadky-zasob-v-distribucnich-centrech.yaml
      - dc-meltdown-stockouts.us.datasets.stockouts-monthly-dc.yaml=dc-meltdown-stockouts/bundle/us/datasets/stockouts-monthly-dc.yaml
      - dc-meltdown-stockouts.us.charts.stock-out-weeks-by-month-and-dc-2025.yaml=dc-meltdown-stockouts/bundle/us/charts/stock-out-weeks-by-month-and-dc-2025.yaml
      - dc-meltdown-stockouts.us.charts.stock-out-weeks-in-2025.yaml=dc-meltdown-stockouts/bundle/us/charts/stock-out-weeks-in-2025.yaml
      - dc-meltdown-stockouts.us.charts.stock-out-weeks-per-dc-2025.yaml=dc-meltdown-stockouts/bundle/us/charts/stock-out-weeks-per-dc-2025.yaml
      - dc-meltdown-stockouts.us.dashboards.dc-meltdown-stock-outs.yaml=dc-meltdown-stockouts/bundle/us/dashboards/dc-meltdown-stock-outs.yaml
      - returns-by-category.cz.datasets.returns-monthly-by-category.yaml=returns-by-category/bundle/cz/datasets/returns-monthly-by-category.yaml
      - returns-by-category.cz.charts.radky-reklamaci-v-roce-2025.yaml=returns-by-category/bundle/cz/charts/radky-reklamaci-v-roce-2025.yaml
      - returns-by-category.cz.charts.reklamace-po-kategoriich-2025.yaml=returns-by-category/bundle/cz/charts/reklamace-po-kategoriich-2025.yaml
      - returns-by-category.cz.charts.reklamace-podle-kategorie-zbozi-2025.yaml=returns-by-category/bundle/cz/charts/reklamace-podle-kategorie-zbozi-2025.yaml
      - returns-by-category.cz.dashboards.reklamace-podle-kategorie.yaml=returns-by-category/bundle/cz/dashboards/reklamace-podle-kategorie.yaml
      - returns-by-category.us.datasets.returns-monthly-by-category.yaml=returns-by-category/bundle/us/datasets/returns-monthly-by-category.yaml
      - returns-by-category.us.charts.return-lines-in-2025.yaml=returns-by-category/bundle/us/charts/return-lines-in-2025.yaml
      - returns-by-category.us.charts.return-requests-by-item-category-2025.yaml=returns-by-category/bundle/us/charts/return-requests-by-item-category-2025.yaml
      - returns-by-category.us.charts.returns-by-category-2025.yaml=returns-by-category/bundle/us/charts/returns-by-category-2025.yaml
      - returns-by-category.us.dashboards.returns-by-category.yaml=returns-by-category/bundle/us/dashboards/returns-by-category.yaml
generatorOptions:
  # Stable name — the import Job mounts `superset-dashboards`.
  disableNameSuffixHash: true
