# hartland's MEASURE vocabulary — er-targeted (re-authored 2026-08-13).
#
# ── Why this file exists again ────────────────────────────────────────────────────────
# RV-P3.2 T4 authored an `aliases/` + `values/` area whose measure rows pointed at `md.`.
# All of it was removed on 2026-08-10 ("Remove the md-targeted lexicon vocabulary") for a
# correct reason: the merged Golem's query door renders a bound ref into a TransDSL data
# object, and an `md.` ref names neither an object nor an aggregation, so a question that
# bound one was refused BY NAME (kantheon RV-P6.5, ruling B). The removal was right; what
# it left behind was an estate with **no measure vocabulary at all**.
#
# The cost showed up on the demo box on 2026-08-13. *"What are the marketplace revenues
# for 2025 by month?"* answered `I don't recognise "the marketplace revenues"` — because
# `marketplace` resolved (`er.entity.catalog_sales`), `month` resolved (`ground:chrono`),
# and `revenue` matched nothing in any form: not `revenue`, not `turnover`, not `obrat`,
# not `tržb*`. Four of the six `example_questions` each Shem advertises are measure
# questions, so the Shem's own headline beat could not resolve.
#
# This file is the removal's other half, deferred until there was a binding behind it:
# **the same words, pointed at `er.` attributes instead of `md.` measures.** That is the
# shape the door can actually read — `TransDslRenderer.address()` maps
# `er.entity.<entity>.<attribute>` onto `plan.v1.QualifiedName`'s four parts with no
# metadata lookup, and a `FRAME_ROLE_MEASURE` attribute is SUMmed. Verified against the
# compiler rather than assumed: an attribute-depth `er.` target compiles to a DECLARED
# `MODEL_OBJECT` row, and a misspelt attribute earns `RG-LEXC-001` and is dropped.
#
# `model/md/` is untouched. When Veles publishes an md binding, md vocabulary comes back
# on top of this — it does not replace it.
#
# ── ⚑⚑ Why there are no BARE measure words here, and why that is the toolchain's call ──
# On the md layer `revenue` was ONE measure and the channel was a dimension. On the er
# layer it is three attributes on three entities, so a bare *"revenue"* genuinely names
# three things. The first draft of this file said so — three entries, same term, one target
# each — on the theory that three equal candidates is the textbook `G2_AMBIGUOUS` and the
# user should be asked *which channel*.
#
# **The compiler refuses that shape**, and the message is the ruling:
#
#     RG-LEX-006 term "revenue" (en) is declared twice in this file —
#                Two targets for one term in one file have no defined winner.
#
# 38 violations, no archive written. The declared layer is single-target-per-term by
# construction: it is a mapping, and expressing ambiguity in it is not an authoring choice
# the schema offers. So bare measure words stay UNDECLARED rather than being pointed at an
# arbitrarily chosen channel — pointing them at one would be the guess this whole design
# exists to refuse, and it would answer *"revenue by channel"* with one channel's number.
#
# The practical cost is small and bounded: every corpus question that uses a bare measure
# word (`channel_revenue_monthly`, `category_revenue`, `top_items_by_revenue`) is a
# CROSS-channel or cross-entity question, which `TransDslRenderer` refuses anyway ("the
# question spans more than one object — joining them is a modelling decision this door will
# not make"). Those are answered by their `search { patterns }` blocks in
# `model/queries/q_hartland.ttrm`, on the legacy pattern path, exactly as before this file.
# What this file restores is the single-channel half — which is where the fast path lives.
#
# ⚑ If bare measure words are wanted on the fast path, that is an md exercise (one measure,
# channel as a dimension) or a modelling one (a channel-labelled sales view, so that one
# object carries all three). It is not a lexicon change, and it should not be forced into
# one.
#
# ✅ 2026-09-24 — the modelling one landed: `er.entity.channel_sales`, a view-backed fact (see
# the "REVENUE and CHANNEL — all channels" section below), replaced by `er.entity.sales` over the
# model's own union query at md/hop HP-H (2026-10-24). The bare words point at the one object that
# carries all three channels, and since HP-H every channel word does too: the three per-channel
# entities are its sources only (⚑H-7), and the channel-qualified phrases below are gone.
#
# ── Sourcing ─────────────────────────────────────────────────────────────────────────
# Every term is attested. The `search { patterns }` blocks in
# `model/queries/q_hartland.ttrm` are the densest source and are cited per entry; the rest
# come from `design/demo-transcript.md` and both Shems' `example_questions`.
#
# ── What this file deliberately does NOT declare ─────────────────────────────────────
# Channel-qualified revenue phrases (`tržby z prodejen`, "marketplace revenue", …) — declared on each
#   channel fact's measure from 2026-08-13 (`tržby z prodejen` from ttr-demo#62, 2026-10-14) until
#   md/hop HP-H (2026-10-24) made the three facts sources of `sales` only (⚑H-7). The revenue word
#   and the channel word now bind separately — see "REVENUE — channel-qualified" below. The facts
#   carry no label either: a label is a METADATA term and beats any declared phrase (EXACT 1.168 on
#   three words — «Tržby z prodejen za 2025» once bound `store_sales` itself through one).
# Bare channel words (`marketplace`, `web`, `prodejna`, …) — declared once, in `channels.lex.yaml`
#   beside this file (the values of `sales.channel`, md/hop HP-H; the `.ttrm` sugar surface carried
#   them until then). A file may not give one word two targets (RG-LEX-006), and the store word has
#   two on purpose — the channel there, the dimension below.
# UNITS SOLD and RETURNED AMOUNT — same three-entity shape as revenue, and unlike revenue
#   they have no attested channel-qualified surface: the corpus says "units sold" and
#   "returns", never "marketplace units". Inventing one to dodge RG-LEX-006 would put words
#   in users' mouths, which is the one thing this area's discipline forbids. They wait for
#   the same md/modelling exercise as the bare words above.
#   ✅ UNITS SOLD landed 2026-09-24 on `channel_sales.quantity` (the modelling exercise; `sales.quantity` since HP-H). RETURNED
#   AMOUNT still waits: returns are three entities with no all-channel view yet.
#   ✅ The channel-qualified half of RETURNED AMOUNT landed 2026-10-14 (ttr-demo#62, Bora's ruling
#   „vratka / vratky“ → the returns measure): «vratky z prodejen» and its twins, see "RETURNS"
#   below. The bare «vratky» still waits for the all-channel view, for the same reason as above.
# `return rate` / `míra vrácení` — a RATIO of `return_amt` to `ext_sales_price`, which live
#   on two different entities. The door refuses a two-object question, so a word for it
#   would resolve into a refusal. It belongs to a pattern query, not to this layer.
# Member codes (DC names, return reasons, channel literals) — `values/` territory, removed
#   with this file and NOT restored here: those rows targeted `md.` members, and the er-side
#   equivalents are `warehouse_name`/`reason_desc` text columns, which is a filter story
#   rather than a vocabulary one. Separate exercise, deliberately not bundled in.
#
# ── Matching ─────────────────────────────────────────────────────────────────────────
# `defaults.match` carries RV-44's declared profile: exact canonical, one-edit typos, and a
# `folded` rule at 0.90 because diacritic-free typing (`trzby`, `trziste`) is this estate's
# most common input variance — and the q_hartland patterns are themselves written unfolded.
# Every multiword phrase takes `method: TOKENS` — except RETURNS and CUSTOMER REVENUE below, which
# match as whole phrases under this default profile; each says why.
schema: ttr-lexicon/v1
defaults:
  lang: cs
  match:
    - { norm: canonical, exact: 1.00, typos: { distance: 1, penalty: 0.05 } }
    - { norm: folded,    exact: 0.90 }
entries:
  # ══ REVENUE — channel-qualified: NOT a phrase any more (md/hop HP-H, ⚑H-7) ════════════
  # Until 2026-10-24 «tržby z tržiště», "marketplace revenue", «obrat z prodejen» and their twins were TOKENS
  # phrases on each channel fact's measure (`catalog_sales` / `web_sales` / `store_sales`.ext_sales_price). Those
  # three facts are now sources of `sales` only (model/er/sales.ttrm) and no word reaches them. A channel-qualified
  # question COMPOSES instead: the revenue word binds the measure below (`sales.ext_sales_price`), the channel word
  # binds the channel — a value label of `sales.channel` (`channels.lex.yaml` beside this file) the resolver binds as
  # `er.entity.sales.channel#marketplace` — and the door restricts by it: `channel = 'marketplace'`.
  # A phrase cannot say both: it is one span with one target, and a span on the member alone would leave the
  # question no measure to read. The inflected channel words the phrases used to carry by TOKENS («webu»,
  # «tržišti», «prodejen») are spelled out on the channel's terms instead.


  # ══ REVENUE and CHANNEL — all channels → er.entity.sales ══════════════════════════════
  # 2026-09-24. The bare words the header explains away now have ONE target each: the all-channel
  # fact — `channel_sales` on the db view until md/hop HP-H (2026-10-24), `sales` over the model's own
  # union query since (model/er/sales.ttrm) — the "modelling exercise" the header names. On it the
  # channel is a COLUMN and revenue is ONE measure, so RG-LEX-006 has nothing to object to and
  # *"revenue by channel for 2025 by month"* binds deterministically: `revenue` → the measure (MS:
  # first in `semantics { measures }`), `channel` → the grouping, `by month` / `2025` → the calendar
  # via `rel_sales_date`. *"Marketplace revenue"* is the same measure restricted by the channel (above).
  # `sales` (en, HP-H): "marketplace sales" was a phrase on the marketplace fact; the word now carries
  # the measure on its own, beside its channel word.
  #
  # Sourcing: `revenue`/`channel` — the `channel_revenue_monthly` / `channel_revenue_yoy` patterns
  # and examples ("Monthly revenue by channel", "revenue by channel over time"); `tržby`/`tržeb`/
  # `kanálu` — "(měsíční) tržby (podle|dle) kanálu", "vývoj tržeb (podle|dle) kanálu";
  # `tržba`/`obrat`/`kanál`/`kanály` — the demo transcript and both Shems' example questions.
  - terms:
      - { text: "tržby" }
      - { text: "tržba" }
      - { text: "tržeb" }
      - { text: "obrat" }
      - { text: "revenue", lang: en }
      - { text: "revenues", lang: en }
      - { text: "sales", lang: en }
    target: er.entity.sales.ext_sales_price

  - terms:
      - { text: "kanál" }
      - { text: "kanálu" }
      - { text: "kanály" }
      - { text: "kanálů" }
      - { text: "channel", lang: en }
      - { text: "channels", lang: en }
    target: er.entity.sales.channel

  # ── Units sold → er.entity.sales.quantity ───────────────────────────────────────────
  # 2026-09-24. The second measure of the all-channel fact, and the "UNITS SOLD" the header
  # listed as waiting for the same modelling exercise. Asked live on hartland ("Show units sold
  # by channel for 2025"): the `local` rung reached the model and still asked back — a measure
  # with no declared word is a guess the ladder rightly refuses to make alone.
  # Sourcing: the model's own descriptions ("units sold = quantity" on every sales entity,
  # "Units sold on this line"). ⚑ The Czech rows are the bilingual Shem's MIRROR, authored rather
  # than attested — the corpus has no Czech units phrase. Strike them if that bar is not met.
  - terms:
      - { text: "units sold", lang: en, method: TOKENS }
      - { text: "sold units", lang: en, method: TOKENS }
      - { text: "prodané kusy", method: TOKENS }
      - { text: "prodaných kusů", method: TOKENS }
    target: er.entity.sales.quantity

  # ══ RETURNS — channel-qualified → er.entity.<channel>_returns.return_amt ══════════════
  # 2026-10-14, ttr-demo#62 (Bora's ruling of 2026-10-12): „vratka / vratky“ → the returns
  # measure. MH E6 asked «Vratky z prodejen» and got a parameter ask, because «Vratky» was no
  # term at all. `return_amt` is each returns entity's FIRST declared measure (the refunded value,
  # model/er/returns.ttrm), so the phrase binds what «reklamace» is asked about by value.
  #
  # ⚑ Attested: the store phrase only (MH E6). The web and marketplace twins keep the three
  # channels symmetric.
  #
  # ⛔ NOT `method: TOKENS`, unlike every other multiword phrase in this file, and the exception is
  # load-bearing. A TOKENS phrase is reached by ONE of its words too. That is how an inflected channel
  # word binds today — «webu», «tržišti», «prodejen» are not terms; each reaches its channel's revenue
  # through the TOKENS phrases it appears in — and it works only while every such phrase targets one
  # ref. The first build of #62 declared these as TOKENS: «webu» then reached web revenue AND web
  # returns, the matcher called it non-discriminative, and «A na webu?», «Porovnej tržby z tržiště a z
  # webu», «… na tržišti …» (demo 3.2, 3.3, 5.1, r2a) all went G1. With the file's default profile they
  # match as whole phrases (canonical exact, one typo, diacritics folded), so no single word — and no
  # bare «vratky» — reaches them. Guarded by lexicon/tests/store-family.test.mjs.
  # `vratka` is the citation form the resolver's anchors read; `vratek` (genitive plural) is spelled
  # out because MorphoDiTa lemmatises it to «vratek», which no anchor meets.
  - terms:
      - { text: "vratky z prodejen" }
      - { text: "vratka z prodejen" }
      - { text: "vratek z prodejen" }
    target: er.entity.store_returns.return_amt
  - terms:
      - { text: "vratky z webu" }
      - { text: "vratka z webu" }
      - { text: "vratek z webu" }
    target: er.entity.web_returns.return_amt
  - terms:
      - { text: "vratky z tržiště" }
      - { text: "vratka z tržiště" }
      - { text: "vratek z tržiště" }
    target: er.entity.catalog_returns.return_amt

  # ══ STORE — the six-store DIMENSION → er.entity.store ════════════════════════════════
  # LP-P3·T9 (2026-09-28): on hartland Czech «prodejny» bound only the store CHANNEL, never this dimension,
  # because `displayLabel.cs: "Prodejna"` is not a mention term — so «prodejny začínající na „abl“» had no
  # head to attribute the quoted literal to; this gives the dimension its Czech forms, and ttr-demo#62 its
  # cases. The word is claimed by the dimension AND the store channel ON PURPOSE (✅MH-D6): the resolver's
  # slot decides (`channels.lex.yaml` says how). Moved here from `model/lexicon/cs/channels.ttrm` at md/hop
  # HP-H, when the channel reading became a member the `.ttrm` sugar cannot target — the two readings of one
  # word must sit on the same surface (`tests/area.test.mjs` T4) and in two files (RG-LEX-006). EXACT, as the
  # sugar compiled it: one edit from «prodejen» is «prodejem», a sale.
  - terms:
      - { text: "prodejna", method: EXACT }
      - { text: "prodejny", method: EXACT }
      - { text: "prodejně", method: EXACT }
      - { text: "prodejnu", method: EXACT }
      - { text: "prodejnou", method: EXACT }
      - { text: "prodejen", method: EXACT }
      - { text: "prodejnám", method: EXACT }
      - { text: "prodejnách", method: EXACT }
      - { text: "prodejnami", method: EXACT }
    target: er.entity.store

  # ══ PRODUCT CATEGORY → er.entity.item.category ═══════════════════════════════════════
  # 2026-09-24. `item.category` had no declared word, so "revenue by category" gapped (G1) on
  # the grouping. With sales → item (`rel_sales_item`; `channel_sales` until HP-H) the fast path can now
  # group ANY channel's revenue by category; `category_revenue` stays the one-channel pattern.
  # Sourcing: `category_revenue` ("Revenue by product category"), the Shem example "Which
  # categories drove the H2 2025 drop?" / "Které kategorie způsobily propad…", and the demo
  # transcript (category ×176, categories ×39, kategorie ×7).
  - terms:
      - { text: "category", lang: en }
      - { text: "categories", lang: en }
      - { text: "product category", lang: en, method: TOKENS }
      - { text: "kategorie" }
      - { text: "kategorií" }
    target: er.entity.item.category

  # ══ CALENDAR GRAIN → er.entity.date_dim.{month,year,quarter,week_seq} ═════════════
  # RV-P6.6. These are what make *"…by month"* and *"…for 2025"* land on a COLUMN instead of
  # stopping at a grounding trigger.
  #
  # ⚑ **GRAIN PHRASES, not the bare nouns — and the choice is deliberate.** `month`, `měsíc`,
  # `rok`, `quarter` are already `ground:chrono` GROUNDING_TRIGGER rows (stdlib +
  # `../grounding/hartland.lex.yaml`). Declaring them again here would be LEGAL — `RG-LEXC-002`
  # keys on term + lang + TARGET, and cross-CLASS overlap is this estate's existing shape
  # (`stát`/`state` is `ground:geo` AND an attribute). It is still not done, because a bare
  # `month` carrying both a chrono trigger and a column binding puts two classes in competition
  # on one span, and that tie-break is the gate's to make rather than the author's to provoke.
  #
  # The phrases carry no such tension: *"by month"*, *"měsíčně"*, *"monthly"* are unambiguously a
  # GRAIN — the user asking to be grouped — and they are what the corpus says
  # (`channel_revenue_monthly`: "(monthly|month by month) revenue (per|by) channel",
  # "(mesicni|měsíční) trzby (podle|dle) kanalu"). Checked in the built artifact rather than
  # assumed: no term lands in both `ground:chrono` and a `date_dim` column.
  #
  # ⚑ Why the calendar is worth binding at all: `er.entity.date_dim` is a separate entity from
  # the sales facts, so a question grouped by month spans TWO objects. That used to be an
  # automatic refusal; since RV-P6.6 the door checks the model for a direct relation and
  # hartland declares exactly one per fact (`rel_sales_date` for the all-channel fact, by its join
  # pair; `rel_catalog_sales_date` and its siblings, each bound to a named FK), so
  # `EXPAND_JOINS-logical` resolves the join downstream.
  #
  # ⚠ `week_seq` is an ABSOLUTE week counter from the start of the calendar, not a week-of-year
  # — the demo's "weeks 31–47" language reads off it directly (`data/recon/R0.md`), so the word
  # points there rather than at a derived week-of-year the model does not carry.
  #
  # ⚑ **The Czech grain ADJECTIVES, every case form (ttr-server#237).** „Měsíční tržby z tržiště
  # v roce 2025“ asks for months, but the estate declared only the adverb and the phrase, so the
  # adjective bound nothing: in front of a declared phrase it vanished and the question was
  # answered as one total, and before a bare noun („Měsíční tržby“) the phrase was a G1. The
  # resolver now reports such a word (ttr-server#239) and finds the grain only through a fuzzy
  # match of the adverb. Declared here, it is an anchor of its own, as `monthly` is, and the
  # resolver's R6" reads a calendar adjective bound to an attribute as the GROUPING. All six case
  # forms of the soft declension (`-í`, `-ího`, `-ímu`, `-ím`, `-ích`, `-ími`), because a lookup
  # of the written form meets the written form. No `denní` / `pololetní`: the estate declares no
  # day or half-year grain, and an undeclared grain adjective is a G1 the user is asked about.
  #
  # ⛔ **No typo budget on these forms**, unlike the file default: exact as written, and the same
  # without diacritics (0.90, the default's `folded` rule). Every form is listed, so a typo budget
  # buys nothing — and each form is ONE edit from a word that is no grain: the time kernel's own
  # period noun (`čtvrtletní`/`čtvrtletí`, `čtvrtletním`/`čtvrtletím`, `čtvrtletních`/`čtvrtletích`
  # — «v prvním čtvrtletí» would have reached the quarter ATTRIBUTE beside chrono's trigger, or tied
  # with it), `ročník`, `ruční`, `měsíčník`. `lexicon/tests/grain-adjectives.test.mjs` pins both.
  - terms:
      - { text: "měsíčně" }
      - { text: "měsíční", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "měsíčního", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "měsíčnímu", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "měsíčním", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "měsíčních", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "měsíčními", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "po měsících", method: TOKENS }
      - { text: "monthly", lang: en }
      - { text: "by month", lang: en, method: TOKENS }
      - { text: "month by month", lang: en, method: TOKENS }
    target: er.entity.date_dim.month
  - terms:
      - { text: "ročně" }
      - { text: "roční", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "ročního", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "ročnímu", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "ročním", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "ročních", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "ročními", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "po letech", method: TOKENS }
      - { text: "za rok", method: TOKENS }
      - { text: "yearly", lang: en }
      - { text: "annual", lang: en }
      - { text: "by year", lang: en, method: TOKENS }
    target: er.entity.date_dim.year
  - terms:
      - { text: "čtvrtletně" }
      - { text: "čtvrtletní", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "čtvrtletního", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "čtvrtletnímu", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "čtvrtletním", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "čtvrtletních", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "čtvrtletními", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "po čtvrtletích", method: TOKENS }
      - { text: "quarterly", lang: en }
      - { text: "by quarter", lang: en, method: TOKENS }
    target: er.entity.date_dim.quarter
  - terms:
      - { text: "týdně" }
      - { text: "týdenní", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "týdenního", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "týdennímu", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "týdenním", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "týdenních", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "týdenními", match: [{ norm: canonical, exact: 1.00 }, { norm: folded, exact: 0.90 }] }
      - { text: "po týdnech", method: TOKENS }
      - { text: "weekly", lang: en }
      - { text: "by week", lang: en, method: TOKENS }
    target: er.entity.date_dim.week_seq

  # ══ STOCK ON HAND → er.entity.inventory.quantity_on_hand ══════════════════════════
  # The one measure with no channel split — inventory is one entity, so bare words are
  # unambiguous here and RG-LEX-006 does not arise. Beat 3's corroborating finding is the
  # 17-week zero-on-hand streak at Memphis, and both Shems advertise "Which items were out
  # of stock at Memphis DC in October 2025?" / "Které položky byly vyprodané v Brno DC v
  # říjnu 2025?".
  #
  # ⚑ `vyprodáno` / `out of stock` name the ZERO CASE, not the quantity — strictly they are
  # a restriction (`quantity_on_hand = 0`) riding a measure word. The er layer has no
  # separate stockout attribute to point them at, and the removed md file made exactly the
  # same choice against `md.measure.onHandQty`. Recorded rather than silently smoothed.
  #
  # `zásoba` is the citation form, and it is here for the resolver's ANCHORS (LR, 2026-10-11).
  # An anchor matches a term by the token as written or by its lemma, and every case of the
  # word — `zásob`, `zásobách`, `zásobami` — lemmatises to `zásoba`, which no term spelled. So
  # «Kolik týdnů v roce 2025 byly v Brně výpadky zásob?» had no stock anchor when the place was
  # read, and «Brně» took the store; with the anchor, the DC the stock fact reaches wins.
  - terms:
      - { text: "zásoba" }
      - { text: "zásoby" }
      - { text: "stav zásob", method: TOKENS }
      - { text: "skladem" }
      - { text: "vyprodáno" }
      - { text: "není skladem", method: TOKENS }
      - { text: "nulový stav", method: TOKENS }
      - { text: "on hand", lang: en, method: TOKENS }
      - { text: "stock on hand", lang: en, method: TOKENS }
      - { text: "inventory on hand", lang: en, method: TOKENS }
      - { text: "out of stock", lang: en, method: TOKENS }
      - { text: "zero on hand", lang: en, method: TOKENS }
      - { text: "stockout", lang: en }
    target: er.entity.inventory.quantity_on_hand

  # ══ CUSTOMER REVENUE → er.entity.customer_revenue.revenue ═════════════════════════
  # LQ (logical queries), 2026-10-18. The measure of the entity stacked on the logical query
  # `er.query.revenue_per_customer` (model/er/customer_revenue.ttrm): one customer's ALL-TIME revenue
  # across all channels, already SUMmed per customer — so "average customer revenue by buying potential"
  # is a plain AVG over it. Declared on the MEASURE, not as the entity's label: a label is a METADATA
  # term and would bind the entity where the measure is meant (the ttr-demo#62 lesson), so the entity is
  # labelled "Customer Totals" / „Souhrny zákazníků“ and the phrase lives here.
  # Sourcing: authored with the entity — the LQ acceptance question ("average customer revenue by
  # household buying potential", „průměrné tržby zákazníka podle kupního potenciálu domácnosti“).
  # The longer span wins over the bare `revenue` / `tržby` above (sales).
  #
  # ⛔ NOT `method: TOKENS` — the RETURNS exception above, for two reasons of its own:
  #   - a TOKENS row carries its own match profile (canonical tokens only), so it drops this file's
  #     `folded` rule: «prumerne trzby zakaznika …», typed without diacritics — this estate's most
  #     common input — would miss the phrase and bind the bare `tržby` (sales): the average
  #     SALES LINE, not the average customer, a plausible number nothing flags;
  #   - a TOKENS row is reached by its fragments, and two of these are built on `per` / `na`, which the
  #     stdlib's avg skill (ttr-core#178) refuses as triggers because they usually name a grouping or a
  #     channel ("revenue per month", „tržby na tržišti“). The stdlib's rule for multi-word forms:
  #     whole phrases, never TOKENS.
  # With the file's default profile each row matches as a whole phrase (canonical exact, one typo,
  # diacritics folded). The Czech cases are spelled out — a typo budget of one does not reach a form
  # two edits away — for the forms a question about customers' revenue takes: the singular customer
  # (`zákazníka`, „tržby zákazníka“) and the plural (`zákazníků`, „průměrné tržby zákazníků“), each with
  # the nominative/genitive of the revenue word („průměr tržeb zákazníků“).
  # Guarded by lexicon/tests/customer-revenue.test.mjs.
  - terms:
      - { text: "customer revenue", lang: en }
      - { text: "customer revenues", lang: en }
      - { text: "revenue per customer", lang: en }
      - { text: "tržby zákazníka" }
      - { text: "tržba zákazníka" }
      - { text: "tržeb zákazníka" }
      - { text: "tržby zákazníků" }
      - { text: "tržeb zákazníků" }
      - { text: "tržby na zákazníka" }
    target: er.entity.customer_revenue.revenue

  # ══ STOCK-OUT WEEKS → er.entity.dc_stockout_month.stockout_weeks ══════════════════
  # BI-4 (contracts C-22), 2026-10-22. The measure of the entity stacked on the logical query
  # `er.query.stockouts_monthly_dc` (model/er/stockouts.ttrm): per DC per month, the weekly snapshots with at
  # least half of the DC's rows at zero — the same weeks `q.hartland.warehouse_stockout_week_count` counts.
  # The phrases name the MEASURE, stock-out weeks, and never:
  #   - the bare stock-out words. «Kolik týdnů v roce 2025 mělo Brno DC výpadky zásob?» (act 3.5) is the saved
  #     query's, reached through the stock anchor above and its patterns; a «výpadky zásob» row would be the
  #     longer span and take the question from it;
  #   - the month. «po měsících» / "monthly" / "by month" are the calendar's (er.entity.date_dim.month, above); a
  #     phrase holding them would swallow the grouping and answer one total.
  # Whole phrases under the file's default profile, NOT TOKENS (the customer-revenue reasons: the folded rule, and
  # fragments — «týdnů», «zásob» — that would reach the measure on their own). The Czech forms a question takes are
  # spelled out: nominative and genitive plural of the weeks, with «výpadkem» or «výpadky».
  # Guarded by lexicon/tests/stockouts.test.mjs.
  - terms:
      - { text: "stockout weeks", lang: en }
      - { text: "týdny s výpadkem zásob" }
      - { text: "týdnů s výpadkem zásob" }
      - { text: "týdny s výpadky zásob" }
      - { text: "týdnů s výpadky zásob" }
    target: er.entity.dc_stockout_month.stockout_weeks
