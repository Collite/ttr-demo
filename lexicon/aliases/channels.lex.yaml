# hartland's CHANNEL words — the values of `sales.channel` (md/hop HP-H, 2026-10-24).
#
# ── What changed, and why here ───────────────────────────────────────────────────────
# Until HP-H the channel words were `model/lexicon/{cs,en}/channels.ttrm` terms on the three channel facts
# (`catalog_sales`, `web_sales`, `store_sales`), and «tržby z tržiště», "marketplace revenue" and their twins were
# TOKENS phrases on each fact's measure (`aliases/hartland.lex.yaml`). ⚑H-7 (Bora, 2026-10-22: source only) took
# the three facts out of the agents' vocabulary: they are the sources the all-channel `sales` reads
# (model/er/sales.ttrm), and every channel word now names a VALUE of `sales.channel`:
#
#   er.entity.sales.channel.<value>   — a member, declared by `sales.channel`'s `valueLabels`
#
# The resolver binds one as `er.entity.sales.channel#<value>` (ttr-server, the value-label member ref) and the query
# door restricts by it, so «tržby z tržiště» composes: the revenue word binds `sales.ext_sales_price`, the channel
# word restricts it to `channel = 'marketplace'`.
#
# They live in the data area, not the `.ttrm` sugar, because the editor's resolver (TS) does not resolve a member
# ref in a term's `for:` — the Kotlin compiler does (`ModelRefIndex`: `<attribute-ref>.<code>` for a code the
# attribute labels is a MEMBER).
#
# ── The forms ────────────────────────────────────────────────────────────────────────
# The words the channel terms carried, plus the case forms of the Czech ones: until HP-H «webu», «tržišti»,
# «prodejen» reached their channel through the TOKENS revenue phrases, which are gone, and a mention is looked up
# by its dictionary form only when it is ONE word and the NLP front is up (`LemmaLookup`) — so the estate declares
# the forms it means (the warehouses.ttrm reasoning). "store revenue" / "retail revenue" were phrases on the store
# fact's measure; "store" and "retail" now carry the channel on their own. «e-market» was «e=market» in the
# sugar, a typo no question could match. The `valueLabels` themselves (Kanál prodejen / Web / Tržiště, Store channel /
# Web / Marketplace) are METADATA rows on the same members — the store channel's label is deliberately not the store
# word, so an ask between the two readings offers „Prodejna“ beside „Kanál prodejen“.
#
# ── The store word reads by its ROLE (✅MH-D6, ttr-demo#62) ─────────────────────────
# «prodejna» / "store(s)" is also the six-store DIMENSION's word (`er.entity.store`: its labels, and its Czech cases
# in `aliases/hartland.lex.yaml` — a separate file, because one file may not give one word two targets,
# RG-LEX-006). Both readings are declared EXACT and the resolver's slot decides: grouped by («podle prodejen») or
# counted («kolik prodejen») it is the dimension, a word that governs a store name («prodejny Praha») is the
# dimension, and a restriction asks between the dimension and the store channel. «Tržby z prodejen» was a declared
# phrase on the store fact's measure and answered; it is now that restriction, and asks.
#
# Every form is `method: EXACT` — canonical, no typo budget, no folding — as the `.ttrm` sugar compiled them: a
# one-edit neighbourhood around «prodejen» reaches «prodejem» (a SALE), and «trziste» typed without diacritics
# stays the composer's, as it was (routing corpus a1-4a).
#
# Guarded by lexicon/tests/store-family.test.mjs.
schema: ttr-lexicon/v1
defaults:
  lang: cs
  match:
    - { norm: canonical, exact: 1.00, typos: { distance: 1, penalty: 0.05 } }
    - { norm: folded,    exact: 0.90 }
entries:
  # ── the marketplace (third-party sellers) ───────────────────────────────────────────
  - terms:
      - { text: "tržiště", method: EXACT }
      - { text: "tržišti", method: EXACT }
      - { text: "tržištěm", method: EXACT }
      - { text: "e-market", method: EXACT }
      - { text: "market", method: EXACT }
      - { text: "marketplace", lang: en, method: EXACT }
      - { text: "3P", lang: en, method: EXACT }
      - { text: "third-party", lang: en, method: EXACT }
      - { text: "marketplace sellers", lang: en, method: EXACT }
      - { text: "sellers", lang: en, method: EXACT }
    target: er.entity.sales.channel.marketplace

  # ── the web (the e-shop) ────────────────────────────────────────────────────────────
  - terms:
      - { text: "web", method: EXACT }
      - { text: "webu", method: EXACT }
      - { text: "webem", method: EXACT }
      - { text: "online", method: EXACT }
      - { text: "e-shop", method: EXACT }
      - { text: "e-shopu", method: EXACT }
      - { text: "web", lang: en, method: EXACT }
      - { text: "online", lang: en, method: EXACT }
      - { text: "hartland.com", lang: en, method: EXACT }
      - { text: "e-shop", lang: en, method: EXACT }
    target: er.entity.sales.channel.web

  # ── the stores (brick and mortar) — the channel reading of the store word ──────────
  - terms:
      - { text: "prodejna", method: EXACT }
      - { text: "prodejny", method: EXACT }
      - { text: "prodejně", method: EXACT }
      - { text: "prodejnu", method: EXACT }
      - { text: "prodejnou", method: EXACT }
      - { text: "prodejen", method: EXACT }
      - { text: "prodejnám", method: EXACT }
      - { text: "prodejnách", method: EXACT }
      - { text: "prodejnami", method: EXACT }
      - { text: "kamenná prodejna", method: EXACT }
      - { text: "obchod", method: EXACT }
      - { text: "store", lang: en, method: EXACT }
      - { text: "stores", lang: en, method: EXACT }
      - { text: "brick and mortar", lang: en, method: EXACT }
      - { text: "retail", lang: en, method: EXACT }
      - { text: "retail stores", lang: en, method: EXACT }
      - { text: "TN stores", lang: en, method: EXACT }
    target: er.entity.sales.channel.store
