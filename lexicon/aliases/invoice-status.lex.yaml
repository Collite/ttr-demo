# hartland's word for an UNPAID invoice — a value of `invoice.status` (2026-11-09, Bora: the Hartland demo).
#
# «nezaplacená» names the stored value `open` (model/er/orders.ttrm: `status` holds open · paid). A member: the
# resolver binds it as `er.entity.invoice.status#open` and the query door restricts by it (status = 'open').
#
# ⚠ It reaches a question only where the adjective is a mention of its OWN — the predicate («faktury, které jsou
# nezaplacené»), or standing alone. In front of its noun («nezaplacené faktury») it never does (2026-11-10, hartland,
# turn 81e9548d — G1_UNBOUND on the whole phrase): the resolver folds an `amod` adjective into its noun's anchor phrase
# unless the adjective is itself an anchor, and a MEMBER row deliberately never is (ttr-server
# LexiconArchiveRegistrySource: member words must not fragment noun phrases). The phrase is looked up as one span, and
# the single words inside it are never asked. So «nezaplacená faktura» and its cases are a PHRASE on the conceptual
# phase `cn.OpenInvoice` (model/lexicon/cs/cn.ttrm, beside «neuhrazená faktura»): highlighted, the invoice entity
# bound, and the composer reads the phase (live, «neuhrazené faktury»: `status = 'open'`).
#
# The forms are written out, never left to the dictionary form, for two reasons. MorphoDiTa lemmatises a negated word
# to its POSITIVE lemma («nezaplacené» → `zaplacený`, the negation only in the tag), so a lemma reading would land on
# the opposite value. And the resolver's `LemmaLookup` never asks a row of a file with a `defaults: match:` profile.
# «nezaplaceno» mirrors the value label „Neuhrazeno“. Not declared: "unpaid" — it is the EN value label already
# (a METADATA row; repeating it is RG-LEXC-002), and the bare «neuhrazená» family, which stays the concept's phrase.
#
# Every form is `method: EXACT`, as the channel words: no typo budget around a short adjective.
#
# Guarded by lexicon/tests/invoice-status.test.mjs.
schema: ttr-lexicon/v1
defaults:
  lang: cs
  match:
    - { norm: canonical, exact: 1.00, typos: { distance: 1, penalty: 0.05 } }
    - { norm: folded,    exact: 0.90 }
entries:
  # ── unpaid = status 'open' ──────────────────────────────────────────────────────────
  - terms:
      - { text: "nezaplacená", method: EXACT }
      - { text: "nezaplacené", method: EXACT }
      - { text: "nezaplacených", method: EXACT }
      - { text: "nezaplacenou", method: EXACT }
      - { text: "nezaplaceným", method: EXACT }
      - { text: "nezaplacenými", method: EXACT }
      - { text: "nezaplaceno", method: EXACT }
    target: er.entity.invoice.status.open
