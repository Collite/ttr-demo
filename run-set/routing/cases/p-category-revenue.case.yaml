notes: |
  A pattern question: the composer should pick this saved query (statement source PATTERN). Recorded, not asserted: which saved query ran.
  2026-10-14: the query's examples now say what it answers — revenue per category for one channel in one whole year. The
  old example, „Které kategorie způsobily propad v 2. pol. 2025?“ / "Which categories drove the H2 2025 drop?", asked
  for a drop the query does not compute and a half-year it cannot take, on a false premise (H2 2025 is ~2.3× H1 in both
  worlds). Live, cs was refused on 2026-10-12 (REFUSE · PLAN_GATE_REFUSED) and asked back on 2026-10-14 (ASK ·
  NO_OBJECT_BINDING, golem 0.11.37); en answered ten category rows to a question about a drop that did not happen.
  Measured cs 2026-10-14 (golem 0.11.37): LLM · UNHONOURED_OBJECT:web, one LLM call; the composer ran this saved query
  for web and 2025: 11 rows, the ten categories and the items without one. The en half is not measured yet.
  2026-10-24 (md/hop HP-H, ttr-demo#118): re-baselined to FAST. `web` is now a member of `sales.channel`, so the door
  answers the breakdown itself (cz measured: FAST, 11 rows, Books 815 088 430,22 = the web figure) and the saved query is
  no longer reached. The validation drops `first_row`: the door orders by category, and the question asks for no ranking.
  en not measured since HP-H.
