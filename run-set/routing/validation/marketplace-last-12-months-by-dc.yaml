notes: |
  kantheon#194 — a question with no period reads the last 12 complete months: [first day of the month 12 months
  before {reference_date}'s month, first day of {reference_date}'s month). The door applies it (kantheon#196).
core: |
  SELECT w.w_warehouse_name AS dc, SUM(cs.cs_ext_sales_price) AS revenue
  FROM catalog_sales cs
  JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  JOIN warehouse w ON cs.cs_warehouse_sk = w.w_warehouse_sk
  WHERE d.d_date >= date_trunc('month', DATE '{reference_date}') - interval '12 months'
    AND d.d_date < date_trunc('month', DATE '{reference_date}')
  GROUP BY w.w_warehouse_name
assert:
  row_count: 5
  row_set:
    keys:
    - dc
    value: revenue
    tolerance: 0.001
