notes: |
  Store id AAAAAAAABAAAAAAA — Praha / Nashville (data/seed/naming-us.sql, localize-cz 01).
core: |
  SELECT SUM(ss.ss_ext_sales_price) AS revenue
  FROM store_sales ss
  JOIN store s ON ss.ss_store_sk = s.s_store_sk
  JOIN date_dim d ON ss.ss_sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025 AND s.s_store_id = 'AAAAAAAABAAAAAAA'
assert:
  scalar:
    value: revenue
    tolerance: 0.001
