notes: |
  The en elliptic follow-up "And the year before?" (n6b): anaphoric, the year before the conversation's
  period (n6a's 2025). The cs „A loni?“ is deictic and validates against marketplace-2025.yaml (ruled 2026-10-14).
core: |
  SELECT SUM(cs.cs_ext_sales_price) AS revenue
  FROM catalog_sales cs
  JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2024
assert:
  scalar:
    value: revenue
    tolerance: 0.001
