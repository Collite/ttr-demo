notes: |
  Average order value: revenue over DISTINCT orders (492 883,66 Kč / $21,429.72).
core: |
  SELECT SUM(cs.cs_ext_sales_price) / COUNT(DISTINCT cs.cs_order_number) AS aov
  FROM catalog_sales cs
  JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025
assert:
  scalar:
    value: aov
    tolerance: 0.002
