notes: |
  Warehouse 5 (Brno DC / Memphis DC) — the story's hero; its series collapses August–November 2025.
core: |
  SELECT d.d_moy AS month, SUM(cs.cs_ext_sales_price) AS revenue
  FROM catalog_sales cs
  JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025 AND cs.cs_warehouse_sk = 5
  GROUP BY d.d_moy
assert:
  row_count: 12
  row_set:
    keys:
    - month
    value: revenue
    tolerance: 0.001
