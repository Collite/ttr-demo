notes: |
  kantheon#194 — "Monthly revenue by channel" with no period: the three channels by month over the last 12 complete
  months before {reference_date} (36 rows). A FAST answer that drops the month (3 rows) is kantheon#182.
core: |
  SELECT c.channel, d.d_moy AS month, SUM(c.ext_sales_price) AS revenue
  FROM channel_sales c
  JOIN date_dim d ON c.sold_date_sk = d.d_date_sk
  WHERE d.d_date >= date_trunc('month', DATE '{reference_date}') - interval '12 months'
    AND d.d_date < date_trunc('month', DATE '{reference_date}')
  GROUP BY c.channel, d.d_moy
assert:
  row_count: 36
  row_set:
    keys:
    - channel
    - month
    value: revenue
    tolerance: 0.001
    labels:
      # the answer shows `sales.channel` by its value labels (model/er/sales.ttrm), in the world's language
      marketplace: [Tržiště, Marketplace]
      store: [Kanál prodejen, Store channel]
      web: [Web]
