notes: |
  The three channels in 2025, read through the channel_sales view (the db view stays; since md/hop HP-H the bare
  word „tržby“/revenue binds `sales`, the same union).
core: |
  SELECT c.channel, SUM(c.ext_sales_price) AS revenue
  FROM channel_sales c
  JOIN date_dim d ON c.sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025
  GROUP BY c.channel
assert:
  row_count: 3
  row_set:
    keys:
    - channel
    value: revenue
    tolerance: 0.001
    labels:
      # the answer shows `sales.channel` by its value labels (model/er/sales.ttrm), in the world's language
      marketplace: [Tržiště, Marketplace]
      store: [Kanál prodejen, Store channel]
      web: [Web]
