notes: |
  The three channels in 2025 through the channel_sales view (the object the bare word „tržby“/revenue binds).
core: |
  SELECT c.channel, SUM(c.ext_sales_price) AS revenue
  FROM channel_sales c
  JOIN date_dim d ON c.sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025
  GROUP BY c.channel
assert:
  row_count: 3
  row_set:
    keys:
    - channel
    value: revenue
    tolerance: 0.001
