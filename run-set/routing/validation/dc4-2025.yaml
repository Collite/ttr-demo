notes: |
  Marketplace revenue 2025 at warehouse 4 (Hradec Králové DC / Allentown DC).
core: |
  SELECT SUM(cs.cs_ext_sales_price) AS revenue
  FROM catalog_sales cs
  JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025 AND cs.cs_warehouse_sk = 4
assert:
  scalar:
    value: revenue
    tolerance: 0.001
