notes: |
  Four figures; the LLM may answer them long (one row each) or pivoted (years as columns), so every value is looked for in any row (pop: false).
core: |
  SELECT 'web' AS channel, d.d_year AS year, SUM(ws.ws_ext_sales_price) AS revenue
  FROM web_sales ws JOIN date_dim d ON ws.ws_sold_date_sk = d.d_date_sk
  WHERE d.d_year IN (2024, 2025) GROUP BY d.d_year
  UNION ALL
  SELECT 'marketplace', d.d_year, SUM(cs.cs_ext_sales_price)
  FROM catalog_sales cs JOIN date_dim d ON cs.cs_sold_date_sk = d.d_date_sk
  WHERE d.d_year IN (2024, 2025) GROUP BY d.d_year
assert:
  row_set:
    keys: []
    value: revenue
    tolerance: 0.001
    pop: false
