notes: |
  The marketplace's share of all three channels in 2025 (~33 %).
core: |
  SELECT SUM(CASE WHEN c.channel = 'marketplace' THEN c.ext_sales_price END) / SUM(c.ext_sales_price) AS share
  FROM channel_sales c
  JOIN date_dim d ON c.sold_date_sk = d.d_date_sk
  WHERE d.d_year = 2025
assert:
  scalar:
    value: share
    tolerance: 0.005
    scale:
    - 1
    - 100
