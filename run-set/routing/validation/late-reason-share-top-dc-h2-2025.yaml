notes: |
  Reason 3 is the late-delivery reason („Nedorazilo včas“ / "Did not get it on time"). Only marketplace returns carry a warehouse. The top DC is warehouse 5.
  The share is ~25 % by count (the core, 24,6 %) or by units (25,1 %); the composer picks one, so the scalar takes 3 %
  relative and either scale. It is there because the winner alone passed a wrong ratio (2026-10-18: late returns ÷ sales
  also puts warehouse 5 first).
core: |
  SELECT w.w_warehouse_name AS dc, AVG(CASE WHEN cr.cr_reason_sk = 3 THEN 1.0 ELSE 0 END) AS share
  FROM catalog_returns cr
  JOIN warehouse w ON cr.cr_warehouse_sk = w.w_warehouse_sk
  JOIN date_dim d ON cr.cr_returned_date_sk = d.d_date_sk
  WHERE d.d_year = 2025 AND d.d_moy >= 7
  GROUP BY w.w_warehouse_name
  ORDER BY share DESC
  LIMIT 1
assert:
  first_row:
    keys:
    - dc
  scalar:
    value: share
    tolerance: 0.03
    scale: [1, 100]
