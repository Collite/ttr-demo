notes: |
  Reason 3 is the late-delivery reason („Nedorazilo včas“ / "Did not get it on time"). Only marketplace returns carry a warehouse. The top DC is warehouse 5; the share is ~25 % by count or by units, so only the winner is asserted.
core: |
  SELECT w.w_warehouse_name AS dc, AVG(CASE WHEN cr.cr_reason_sk = 3 THEN 1.0 ELSE 0 END) AS share
  FROM catalog_returns cr
  JOIN warehouse w ON cr.cr_warehouse_sk = w.w_warehouse_sk
  JOIN date_dim d ON cr.cr_returned_date_sk = d.d_date_sk
  WHERE d.d_year = 2025 AND d.d_moy >= 7
  GROUP BY w.w_warehouse_name
  ORDER BY share DESC
  LIMIT 1
assert:
  first_row:
    keys:
    - dc
