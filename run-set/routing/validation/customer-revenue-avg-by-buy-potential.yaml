notes: |
  LQ (logical queries, ttr-demo#78) — the acceptance question: the average of each customer's revenue (every
  channel), per household buying potential — an aggregate of an aggregate. The question states no period, so it
  reads the last 12 complete months before {reference_date} (kantheon#194; Bora 2026-10-24: "keep the 12-month
  rule" — gpt-6.1-sol, composing on `deep`, honours it and says so in its rationale). Until 2026-10-24 this file
  expected each customer's ALL-TIME revenue, `customer_revenue`'s plain AVG, which gpt-5-mini answered by not
  applying the default window.
  The wrong answer this still tells apart is the per-LINE average (AVG over the sales lines grouped the same way),
  which is what a question that misses the customer-revenue phrase and binds the bare revenue word gets — a
  plausible number per band, far smaller (hartland_us, 2026-10-18: ≈ 121,000 per customer against ≈ 2,200 per line,
  in every band). A customer with no sale in the window has no row, and the band is the customer's CURRENT
  household (`c_current_hdemo_sk`), as `customer.hdemo` binds it.
core: |
  SELECT hd.hd_buy_potential AS buy_potential, AVG(r.revenue) AS avg_revenue
  FROM (SELECT c.c_customer_sk, c.c_current_hdemo_sk, SUM(s.ext_sales_price) AS revenue
        FROM channel_sales s
        JOIN date_dim d ON s.sold_date_sk = d.d_date_sk
        JOIN customer c ON s.customer_sk = c.c_customer_sk
        WHERE d.d_date >= date_trunc('month', DATE '{reference_date}') - interval '12 months'
          AND d.d_date < date_trunc('month', DATE '{reference_date}')
        GROUP BY c.c_customer_sk, c.c_current_hdemo_sk) r
  JOIN household_demographics hd ON r.c_current_hdemo_sk = hd.hd_demo_sk
  GROUP BY hd.hd_buy_potential
assert:
  row_count: 6
  row_set:
    keys:
    - buy_potential
    value: avg_revenue
    tolerance: 0.001
