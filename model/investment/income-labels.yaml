# income-labels — what a cash or external-flow movement IS, by the provider's own label (IA-C55, IA-P4b·S4b.2).
#
# The investment report's period evolution (`investment-evolution:v2`, the statement's Evolution) reads every movement's
# `label` (S4b.1: `OperationDescrip`, else `OperationNameCZ`, as DistrInfo spelled it) and looks it up here. A
# movement classed:
#
#   fee                         on the external-flow leg leaves `withdrawals` for `fees` (Conseq books its entry fee
#                               and its commission as a withdrawal beside the deposit); on a deposit it is a refund,
#                               a negative fee. On the cash leg it is shown in `fees` and stays in the cash movements
#                               — unless the external-flow leg carries the same money (a cash-account contract books
#                               one fee on both legs, `DEB<Id>` beside the cash debit `<Id>`): then it is counted once.
#   dividend · coupon · interest the same way into `income`.
#   tax · other                 stays where its leg put it (a tax withheld from a coupon leaves the coupon gross).
#
# A label the table does not know is `other` too, and is COUNTED on every Notes sheet with the five commonest — that
# count is how this file is kept complete. The security leg is never classified: its movements are trades. Its `fee`
# column (FeeAmount, in the estate's home currency) is the provider's record of the trade's fee, which mostly arrives
# as a movement of its own as well — a withdrawal or cash debit classed fee here, around the settlement day. The report
# adds a security fee to `fees` only when no such movement carries the same money; a movement this table cannot
# classify (no label, or one it does not know) counts as carrying it, so nothing is counted twice.
#
# ## How a label is matched
#
# Normalised first, by the renderer (`IncomeLabels.normalize`) and by `scripts/dump-operation-labels` alike — pinned by
# `tests/income-labels.cases.json`:
#
#   1. trimmed, every run of whitespace one space;
#   2. lower case;
#   3. only the text after the LAST ", " — DistrInfo prefixes the fund's short name: `JTOpportCZK, Vstupní poplatek`;
#   4. without a trailing payment ident: `Vklad Ident. 20240115 900000001` → `vklad`;
#   5. trimmed again.
#
# Then an `exact` entry (the default) whose `label` equals the normalised text, else the longest `match: prefix` entry
# it starts with. `leg: cash | external-flow` restricts an entry to that leg; without it the entry applies to both, so
# a label and match kind has one entry per leg at most. Every `label` must already be in its normalised form — the
# renderer refuses to boot on one that is not, because it could never match, and on two entries that overlap.
#
# ## Where these labels come from
#
# Every distinct label of the provider's own extracts — the cash and flow movements of a certification run and of a
# live estate's recent windows — as `dump-operation-labels` prints them with their counts (the dumps beside the package's
# model tests); version 2 adds those of a live estate's whole ledger, read again from each contract's first day. Income
# is rare: the provider's funds accumulate, and the one income label met is a bond's interest (`coupon`); a label that
# appears later is counted on the Notes sheet until it is added here.
#
# ## To extend
#
# Add the normalised label with its class and a note saying why, bump `version` (printed on every Notes sheet, so a
# report names the table it was classified by), and re-render.
version: 2
labels:
  - label: "vstupní poplatek"
    match: prefix
    class: fee
    note: "the entry fee — a withdrawal beside the deposit that paid it (on a cash-account contract also its cash debit, the same money); a prefix, so a named variant is one too and its refund a negative fee"
  - label: "provize conseq"
    class: fee
    note: "the distributor's commission, withdrawn from the client's money"
  - label: "provize"
    class: fee
    note: "a commission, spelled without the distributor's name"
  - label: "poplatek vklad"
    class: fee
    note: "a fee on a deposit"
  - label: "vklad"
    class: other
    note: "a plain deposit (most carry a payment ident)"
  - label: "výběr"
    class: other
    note: "a plain withdrawal"
  - label: "pojištění"
    class: other
    note: "an insurance premium withdrawn from the contract — not an investment cost; it stays a withdrawal"
  - label: "pojištění - vratka"
    class: other
    note: "an insurance premium refunded — follows `pojištění`: it stays a deposit"
  - label: "vklad - popl.prav.investice"
    class: other
    note: "a deposit towards the regular-investment fee — the money arrives as a deposit; the fee itself leaves under its own label"
  - label: "nákup"
    leg: cash
    class: other
    note: "the cash leg paying for a purchase"
  - label: "převod mezi účty"
    class: other
    note: "a transfer between the client's accounts"
  - label: "vyrovnání zůstatku"
    match: prefix
    class: other
    note: "a balance settlement — `vyrovnání zůstatku mie` and the like"
  - label: "zaokr. rozdíl"
    leg: cash
    class: other
    note: "a rounding difference"
  - label: "příspěvek gfo"
    leg: cash
    class: fee
    note: "the contribution to the securities traders' guarantee fund (Garanční fond obchodníků s cennými papíry), debited from the cash account"
  - label: "poplatek za vedení investičního účtu"
    class: fee
    note: "the investment account's maintenance fee, debited from the cash account"
  - label: "poplatek za vedeni inv. uctu"
    match: prefix
    class: fee
    note: "the same fee spelled without diacritics, named with its quarter (`… - <n>q<year>`)"
  - label: "poplatek za využívání platformy"
    match: prefix
    class: fee
    note: "the platform fee — a prefix: some carry the client's service tier after a dash"
  - label: "výpis z evidence investičních nástrojů"
    class: fee
    note: "a statement from the register of investment instruments, charged"
  - label: "manažerský poplatek"
    class: fee
    note: "a management fee"
  - label: "výplata úroku"
    match: prefix
    class: coupon
    note: "interest paid on a bond held, named after the bond — its coupon"
  - label: "* výplata úroku"
    match: prefix
    class: coupon
    note: "the same payment as the provider marks some, with a leading asterisk"
  - label: "srážková daň"
    match: prefix
    class: tax
    note: "the withholding tax on a coupon, named after the bond — tax stays where its leg put it, so the coupon shows gross"
  - label: "* srážková daň"
    match: prefix
    class: tax
    note: "the same tax with the provider's leading asterisk"
  - label: "vklad dip - zaměstnavatel"
    class: other
    note: "a deposit into a long-term investment product (DIP), paid by the employer"
  - label: "vklad dip - klient"
    class: other
    note: "a deposit into a long-term investment product (DIP), paid by the client"
  - label: "prodej"
    leg: cash
    class: other
    note: "the cash leg receiving a sale's proceeds — the counterpart of `nákup`"
  - label: "záloha na mandatorní odkup"
    match: prefix
    class: other
    note: "an advance on a mandatory buyout of shares, named after the issue, and its settlement (`…-zúčtování`)"
  - label: "capital call"
    match: prefix
    class: other
    note: "a fund's capital call — money into an investment, not a cost; its reversal (`… - negace pohledávky`) too"
  - label: "* capital call"
    match: prefix
    class: other
    note: "the same with the provider's leading asterisk"
  - label: "vratka pobídky"
    class: other
    note: "an incentive returned"
  - label: "refundace"
    match: prefix
    class: other
    note: "a refund, named after the fund it concerns"
